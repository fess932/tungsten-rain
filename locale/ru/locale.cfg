[item-description]
tungsten-rod=100 кг чистого дипломатического аргумента: 80 кг вольфрамового сердечника, 15 кг абляционной углеродной оболочки, 5 кг медной спирали Фарадея и инжекторный заряд ракетного топлива. Углеродная оболочка не защищает стержень — при входе в атмосферу она испаряется в плазму, а индуцированное в спирали магнитное поле стабилизирует плазменный кокон вокруг носовой части, снижая аэродинамическую эрозию: стержень несёт собственную атмосферу, и удар принимает она. Стержень разгоняет СЕБЯ до 0.01c (3000 км/с, ~107 килотонн) на собственном ракетном топливе — том же, что жжёт двигатель платформы — прямо в кольце, циркулируя в нём. За медную спираль — индукционно — дефлекторы кольца держат его на стабильной орбите во время разгона и вечно после; энергии на это кольцо не тратит. Боевая часть не входит в комплект — на такой скорости она не требуется.
ring-deflector-station=Сверхпроводящий поворотный магнит на спутниковой шине — один сегмент накопительного кольца. Стержень летит между станциями по прямым хордам; каждая доворачивает его на свой угол, и поворот не совершает работы — собранное кольцо держит разогнанные ракетой стержни вечно и бесплатно. Кольцо ничего не разгоняет — оно только удерживает. Угол доворота на станцию ограничен, поэтому чем быстрее стержень, тем больше дефлекторов нужно, чтобы его удержать: предел удержания кольца — а с ним скорость и урон стержней, которые оно может хранить — растёт с числом станций. Масса — ровно одна ракета. Доставьте в хаб платформы на орбите: кольцо соберётся само. Двадцать ракет — и небо начинает работать на вас.
tungsten-rain-targeter=Выделение — назначить цель для кинетического удара. Alt-выделение — разрешить или приостановить сборку накопительного кольца над текущей планетой (по умолчанию кольца неактивны и ничего не забирают из хабов — грузовые платформы можно загружать без риска скормить груз чужой орбите). Стреляет только разогнанными стержнями; выстрел — это пропущенный поворот: одна станция не включается, и стержень уходит по своей хорде вниз. Не стойте рядом с назначенной точкой. Не стойте нигде рядом с назначенной точкой.

