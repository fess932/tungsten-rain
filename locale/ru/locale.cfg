[item-description]
tungsten-rod=100 кг чистого дипломатического аргумента: 80 кг вольфрамового сердечника, 15 кг абляционной углеродной оболочки, 5 кг медной спирали Фарадея и инжекторный заряд ракетного топлива. Углеродная оболочка не защищает стержень — при входе в атмосферу она испаряется в плазму, а индуцированное в спирали магнитное поле стабилизирует плазменный кокон вокруг носовой части, снижая аэродинамическую эрозию: стержень несёт собственную атмосферу, и удар принимает она. Стержень разгоняет СЕБЯ до 0.01c (3000 км/с, ~107 килотонн) на собственном ракетном топливе — том же, что жжёт двигатель платформы — прямо в кольце, циркулируя в нём. За медную спираль — индукционно — дефлекторы кольца держат его на стабильной орбите во время разгона и вечно после; энергии на это кольцо не тратит. Боевая часть не входит в комплект — на такой скорости она не требуется.
ring-deflector-station=Сверхпроводящий поворотный магнит на спутниковой шине — один сегмент накопительного кольца. На 0.01c стержень в четыреста раз быстрее орбитальной скорости, так что по орбите он не летит вовсе: между станциями он идёт по прямым хордам, а каждая станция доворачивает его к планете на свою долю круга — двадцать раз за оборот, вечно: каждый доворот бросает стержень в сторону планеты, а следующая станция его ловит. Магнитный доворот не совершает над стержнем работы, поэтому собранное кольцо держит разогнанные ракетой стержни почти бесплатно. Кольцо ничего не разгоняет — оно только удерживает. Но отдача реальна: каждый доворот толкает станцию наружу, в сотни раз сильнее, чем её тянет вниз гравитация, поэтому станции нанизаны на замкнутый трос-обруч, свитый прямо на орбите из астероидного углерода, и толчок превращается в натяжение обруча — поэтому же кольцо и вмещает ограниченное число стержней. Длительный доворот станции ограничен, поэтому чем быстрее стержень, тем больше дефлекторов нужно, чтобы его удержать: предел удержания кольца — а с ним скорость и урон стержней, которые оно может хранить — растёт с числом станций. Чтобы выстрелить, станция делает то же, что всегда, только сильнее: банк конденсаторов на один проход форсирует магнит, и он доворачивает стержень примерно на двойную долю. Следующая хорда уже не проходит над горизонтом — она заканчивается в земле. Пропущенный поворот сделал бы обратное: стержень ушёл бы по касательной в дальний космос. Масса — ровно одна ракета. Доставьте в хаб платформы на орбите: кольцо соберётся само. Двадцать ракет — и небо начинает работать на вас.
tungsten-rain-targeter=Выделение — протяни рамку по полю гнёзд, чтобы накрыть его ковром: по стержню на скопление гнёзд, сгруппированных по радиусу взрыва, чтобы не тратить заряды впустую (при нехватке зарядов — сначала самые плотные скопления). Маленькая рамка / клик по пустому месту — одиночный удар по центру. Alt-выделение — разрешить или приостановить сборку накопительного кольца над текущей планетой (по умолчанию кольца неактивны и ничего не забирают из хабов — грузовые платформы можно загружать без риска скормить груз чужой орбите). Стреляет только разогнанными стержнями. Выстрел — это не пропущенный поворот: пропусти его, и стержень ушёл бы по касательной в дальний космос. Это двойной поворот: стреляющая станция форсирует магнит от банка конденсаторов и доворачивает стержень на двойную долю — на хорду, которая заканчивается в земле. Не стойте рядом с назначенной точкой. Не стойте нигде рядом с назначенной точкой.

