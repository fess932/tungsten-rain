[technology-description]
tungsten-rain=Снаряд не разгоняется выстрелом — снаряд живёт разогнанным. Накопительное кольцо — ожерелье дефлекторных станций на низкой орбите: стержень летит между ними по прямым хордам, и каждая станция доворачивает его на свой угол за счёт токов, наведённых в медной спирали Фарадея. Каждая болванка разгоняет себя до маршевых 0.01c собственным двигателем, циркулируя прямо в кольце — дефлекторы её не разгоняют, они лишь держат её на орбите во время разгона и вечно после. Двигатель платформы толкает 510 тонн до 200 км/с тягой в тысячу меганьютонов; 100-кг стержень в пять тысяч раз легче, так что и доли этой тяги хватает разогнать его далеко за маршевую скорость. Поворот не совершает работы, хранение заряда бесплатно. Выстрел — это пропущенный поворот: одна станция не включается, и стержень уходит по хорде вниз. Трение об остаточную атмосферу греет циркулирующие болванки до 1700 K, и ночью кольцо видно с поверхности — нитка тусклых углей поперёк неба. Это не звёзды. Это очередь. В точке падения — огненный шар и ударная волна, как при ядерном взрыве, но без радиации: взрывчаткой является скорость. Цель программы: чтобы страх перед одиноким инженером записался у кусак в ДНК, и их правнуки пересказывали внукам сказания о существе, которое нельзя трогать.

