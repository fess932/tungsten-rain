[mod-setting-description]
tungsten-rain-damage=Урон в центре удара. Линейно спадает до 30% на краю круга. Удар всегда релятивистский: урон вычитается прямо из здоровья (смертельный удар удаляет цель сразу), поэтому не применяется ни процентный, ни плоский резист, ни лимит урона за удар, ни «защита от сверхурона» — та самая броня, которую Rampant fixed вешает на каждый тип урона в data-final-fixes, просто обходится стороной. Тот же удар вдобавок наносит урон типов impact, физический и взрывной через обычную систему — чтобы ванильная логика брони и другие моды на него реагировали; но килл гарантирует именно вычет из здоровья. Эволюция не предусмотрела защиты от предметов на проценте скорости света.
tungsten-rain-fire-damage=Огненный урон огненного шара, тот же спад до 30% на краю. 0 — отключить.
tungsten-rain-start-fires=Испарённый стержень и плазма грунта поджигают внутреннюю зону удара. Учтите: пожару безразлична настройка «Уничтожать деревья».
tungsten-rain-damage-pulses=Урон наносится расходящимся кольцом — столько шагов от центра к краю, вместо одного мгновенного удара. Фронт идёт наружу синхронно с визуальной волной: центр получает пробитие в момент удара, край — последним. Каждая цель получает урон один раз, когда фронт до неё доходит, с обычным спадом (100% в центре, 30% на краю). 1 — один мгновенный удар по всему радиусу.
tungsten-rain-damage-interval=Секунд между расходящимися кольцами. По умолчанию 6 шагов × 0.5 с = трёхсекундная развёртка от центра к краю. Визуальная волна синхронизирована.
tungsten-rain-fx=Расходящиеся кольца взрывов до края радиуса поражения, выжженные пятна, тлеющий дым и затухающий контур круга. Чистая косметика: на урон не влияет, на UPS — чуть-чуть. Выключите, если кадры дороже зрелища.
tungsten-rain-radius=По умолчанию 67 — честная физика для стержня 100 кг на 0.01c. 300 — режим «релятивистская честность». Ваш UPS, ваш выбор.
tungsten-rain-cooldown=По умолчанию 0: выстрел тратит заряженный стержень и сброс конденсаторов — и больше ничего, так что темп стрельбы ограничен только числом заряженных стержней и временем их разгона. Поставьте больше нуля, если хотите дополнительный искусственный лимит между выстрелами.
tungsten-rain-spinup=Время, за которое стержень собственным двигателем — прямо в кольце — разгоняется до скорости, которую кольцо способно удержать, и стабилизируется на орбите. Кольцо его не разгоняет, только удерживает. F=ma с маленьким двигателем делает разгон линейным по конечной скорости: полное кольцо жжёт всё заданное время до 0.01c, полупостроенному нужно лишь 50% скорости — значит вдвое меньше. Указывается для полного кольца.
tungsten-rain-ring-capacity=Сколько разогнанных стержней одновременно циркулирует в кольце каждой планеты. Каждый циркулирующий стержень добавляет свою отдачу к натяжению троса-обруча, на котором висят станции; ёмкость — это то, что обруч способен выдержать.
tungsten-rain-ring-stations=Сколько дефлекторных станций нужно кольцу, чтобы удержать стержень на полной скорости (0.01c). Стержень разгоняет себя сам на ракетном топливе; станции только удерживают его, и чем быстрее стержень, тем больше дефлекторов нужно — поэтому число станций задаёт потолок скорости, а значит и урона стержней, которые кольцо может хранить. Удерживаемая скорость растёт линейно с числом станций, урон — квадратично (энергия ∝ v²), радиус — по кубическому корню. Полупостроенное кольцо держит стержни лишь на 50% скорости (25% урона), но стабилизирует их быстрее.
tungsten-rain-require-rods=Если выключено — удары бесплатны, кольцо не нужно. Для тестов или для тех, кто договорился со своей совестью.
tungsten-rain-friendly-fire=Стержень не разбирает своих и чужих. По умолчанию выключено, потому что мисклики случаются.
tungsten-rain-auto-fire=Пусть кольца стреляют сами: каждый интервал каждое кольцо сыплет стержни по ближайшим вражеским гнёздам в зоне радаров, группируя по радиусу взрыва (без лишних трат), сначала по ближайшим угрозам, в пределах заряженных стержней. Орбитальный ответ на гнёзда, что плодятся быстрее кликов. По умолчанию выключено; при сканировании есть расход UPS.
tungsten-rain-auto-interval=Как часто проходит волна авто-обстрела. Держите выше времени до удара, чтобы по гнезду не выстрелило дважды до приземления первого стержня.
tungsten-rain-auto-range=Насколько далеко вокруг каждого радара авто-обстрел ищет гнёзда. По умолчанию 448 = дальний скан ванильного радара (14 чанков). Поднимите для модовых дальнобойных радаров.
tungsten-rain-auto-worms=Если включено, авто-обстрел бьёт и по вражеским червям (турелям), не только по спавнерам. Черви рядом с гнездом и так гибнут в его взрыве, так что это в основном тратит стержни на одиночных червей.

[tungsten-rain]
ring-disabled=Кольцо над этой планетой не активировано. Alt-выделение целеуказателем — разрешить сборку.
ring-enabled=Сборка кольца над __1__ разрешена. Станций: __2__/__3__, разогнанных стержней: __4__. Кольцо будет забирать станции и болванки из хабов ваших платформ на этой орбите.
ring-paused=Кольцо над __1__ приостановлено: станции и стержни из хабов не забираются. Станций: __2__/__3__, разогнанных стержней: __4__ — заряд сохраняется, стрелять можно. Alt-выделение — возобновить.
ring-not-built=Над этой планетой нет накопительного кольца. Доставьте дефлекторные станции (до __1__ шт. для полной мощности) в хаб платформы на орбите — кольцо соберётся само.
ring-station-installed=Дефлекторная станция выведена на орбиту: __1__/__2__. Кольцо работает на пониженной скорости.
ring-complete=Накопительное кольцо собрано: __1__/__2__ станций. Полная мощность. Небо принадлежит вам.
no-rods=В кольце нет разогнанных стержней и нечего разгонять. Загрузите вольфрамовые стержни в хаб платформы на орбите этой планеты — кольцо подхватит их само.
ring-charging=Стержень ещё разгоняется до маршевой скорости: осталось __1__ с.
no-planet=Здесь нет планеты — а значит, и накопительного кольца над ней.
cooldown=Окно вывода масс-драйвера не готово: осталось __1__ с.
incoming=Стержень сошёл с кольца (мощность __2__%). Удар неминуем. Разогнанных стержней осталось: __1__.
carpet=Ковровая бомбардировка: __1__ стержней по скоплениям гнёзд в рамке (мощность __3__%). Разогнанных стержней осталось: __2__.
carpet-short=Ковровая бомбардировка: выпущено __1__ стержней — __2__ скоплений гнёзд ещё стоят, в кольце кончились заряды.
auto=Орбитальный патруль: __1__ стержней по гнёздам в зоне радаров над __2__.
impact=Кинетический удар подтверждён: [gps=__1__,__2__,__3__]
no-platform-strikes=Стрельба из масс-драйвера по палубе собственной платформы не покрывается гарантией.
gui-title=Накопительные кольца
gui-col-planet=Планета
gui-col-stations=Станции
gui-col-power=Мощность
gui-col-rods=Заряжено
gui-col-spinup=Разгон
gui-spinup-remaining=__1__ с
gui-btn-pause=Приостановить
gui-btn-resume=Возобновить
gui-no-rings=Колец пока нет. Припаркуйте платформу у планеты и активируйте сборку alt-выделением целеуказателя.
