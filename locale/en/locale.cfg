[technology-name]
tungsten-rain=Kinetic bombardment

[technology-description]
tungsten-rain=The projectile is not accelerated by the shot — the projectile lives accelerated. The storage ring is a necklace of deflector stations in low orbit: rods fly straight chords between them, each station bending the path by its share of the circle through currents induced in the copper Faraday spiral. Each slug fires its own engine to a cruising 0.01c while circulating inside the ring — the deflectors do not accelerate it; they only hold it on orbit during the burn and forever after. A platform thruster shoves 510 tonnes to 200 km/s on a thousand meganewtons; a 100 kg rod is five thousand times lighter, so a sliver of that thrust carries it far past cruising speed. Magnetic bending does no work on the rod, so holding the queue costs almost nothing — but every bend kicks back on the station, so the ring is really a swarm of statites holding themselves up on the recoil of the tungsten they throw; let one go dark and it falls. A shot is not a skipped turn — a rod left on its chord only stays in orbit. The firing station instead dumps a capacitor bank into a single hard inward kick, bending the rod off its safe path and down into the atmosphere. Friction against the residual atmosphere heats the circulating slugs to 1700 K, and at night the ring is visible from the surface — a string of dim embers across the sky. Those are not stars. That is the queue. At the point of impact: a fireball and a shockwave, like a nuclear blast but without the radiation — the explosive is velocity. Program goal: to write the fear of the lone engineer into biter DNA, so their great-grandchildren retell legends of the being that must not be touched.

