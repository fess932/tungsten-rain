[item-description]
tungsten-rod=100 kg of pure diplomatic argument: an 80 kg tungsten core, a 15 kg ablative carbon sheath, a 5 kg copper Faraday spiral, and a rocket-fuel injector charge. The carbon sheath does not protect the rod — on atmospheric entry it vaporizes into plasma, and the magnetic field induced in the spiral stabilizes the plasma cocoon around the nose, suppressing aerodynamic erosion: the rod carries its own atmosphere, and that is what takes the hit. The rod fires its own engine to reach 0.01c (3,000 km/s, ~107 kt) on its rocket fuel — the same propellant a platform thruster burns — while circulating inside the storage ring. The copper spiral is what the ring's deflectors grip, inductively, to hold it on a stable orbit during the burn and forever after; the ring spends no energy doing so. Warhead not included — at this velocity it is not required.
ring-deflector-station=A superconducting bending magnet on a satellite bus — one segment of the storage ring. Rods fly straight chords between stations; each station bends the path by its share of the circle, and magnetic bending does no work on the rod, so an assembled ring holds rocket-accelerated rods almost for free. The ring does not accelerate anything; it only contains. The recoil is real, though: each bend shoves back on the station, so the ring really station-keeps on the kick of the tungsten it throws — starve one of power and it slips out of the sky. Each station can only bend the rod by a fixed angle, so the faster the rod the more deflectors it takes to hold it: a ring's containment limit — and the speed, and damage, of the rods it can keep — grows with station count. To fire, one station dumps its whole reserve into a single hard inward kick that bends a rod off its safe chord and down into the atmosphere — left on its chord the rod would only stay in orbit. Mass: exactly one rocket. Deliver to the hub of an orbiting platform: the ring assembles itself. Twenty rockets, and the sky starts working for you.
tungsten-rain-targeter=Select — drag a box over a nest field to carpet it: one rod per nest cluster, clustered by blast radius so no slug is wasted (densest clusters first if the ring runs low). Drag a small box / click empty ground for a single strike at the center. Alt-select — enable or pause storage ring assembly above the current planet (rings start inactive and pull nothing from hubs, so freighter platforms can load up without feeding the wrong orbit). Fires only accelerated rods. A shot is not a free skipped turn — left alone the rod just stays in orbit; the firing station dumps a capacitor bank into one hard inward kick that bends the rod off its chord and down into the atmosphere. Do not stand near the designated point. Do not stand anywhere near the designated point.

