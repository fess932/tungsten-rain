[item-description]
tungsten-rod=100 kg of pure diplomatic argument: an 80 kg tungsten core, a 15 kg ablative carbon sheath, a 5 kg copper Faraday spiral. The carbon sheath does not protect the rod — on atmospheric entry it vaporizes into plasma, and the magnetic field induced in the spiral stabilizes the plasma cocoon around the nose, suppressing aerodynamic erosion: the rod carries its own atmosphere, and that is what takes the hit. The same spiral is what the storage ring's deflectors grip — inductively — while accelerating it to 0.01c (3,000 km/s, ~107 kt). Warhead not included — at this velocity it is not required.
ring-deflector-station=A superconducting bending magnet on a satellite bus — one segment of the storage ring. Rods fly straight chords between stations; each station bends the path by its share of the circle, and bending does no work — an assembled ring holds accelerated rods forever, for free. Each station can only bend the rod by a fixed angle, so the ring's top speed grows with station count. Mass: exactly one rocket. Deliver to the hub of an orbiting platform: the ring assembles itself. Twenty rockets, and the sky starts working for you.
tungsten-rain-targeter=Select — designate a target for a kinetic strike. Alt-select — enable or pause storage ring assembly above the current planet (rings start inactive and pull nothing from hubs, so freighter platforms can load up without feeding the wrong orbit). Fires only accelerated rods; a shot is a skipped turn: one station stays dark, and the rod leaves on its chord, downward. Do not stand near the designated point. Do not stand anywhere near the designated point.

