[mod-setting-description]
tungsten-rain-damage=Damage at the center of the impact. Falls off linearly to 30% at the rim. The strike is always relativistic: the hit is subtracted straight from health (a lethal hit deletes the target outright), so no percentage resist, flat resist, per-hit cap or "overkill protection" applies — the kind of armour Rampant fixed bolts onto every damage type at data-final-fixes is simply bypassed. The same impact also lands impact, physical and explosion damage through the normal system, so vanilla armour logic and other mods still react; but the health chunk is what guarantees the kill. Evolution never prepared a defense against objects arriving at a percent of lightspeed.
tungsten-rain-fire-damage=Fire damage of the fireball, same falloff to 30% at the rim. 0 to disable.
tungsten-rain-start-fires=The vaporized rod and ground plasma ignite the inner blast zone. Note: the fire does not care about the "Destroy trees" setting.
tungsten-rain-damage-pulses=The blast is dealt as an expanding ring, this many steps from center to rim, instead of one instant hit. The front rolls outward in step with the visual shockwave: the core takes the penetrator hit at impact, the rim is reached last. Each target is hit once, as the front passes it, with normal falloff (100% center to 30% rim). 1 = one instant full-radius hit.
tungsten-rain-damage-interval=Seconds between expanding rings. Default 6 steps x 0.5 s = a 3-second sweep from center to rim. The visual wave is timed to match.
tungsten-rain-fx=Expanding rings of explosions out to the blast radius, scattered scorchmarks, smouldering smoke and a fading kill-circle outline. Pure cosmetics: no damage impact, slight UPS impact. Disable if frames matter more than spectacle.
tungsten-rain-radius=Default 67 = honest physics for a 100 kg rod at 0.01c. 300 = "relativistic honesty" mode. Your UPS, your choice.
tungsten-rain-cooldown=Default 0: firing spends a charged rod and a capacitor dump and nothing else, so the rate of fire is limited only by how many rods are charged and how fast the ring spins up new ones. Set above zero if you want an extra artificial limit between shots.
tungsten-rain-spinup=Time for a rod to fire its own engine — while circulating inside the ring — up to the speed the ring can hold, then stabilize on orbit. The ring does not accelerate it; it only contains it. F=ma with the rod's little engine makes the burn linear in the final speed: a full ring burns the whole configured time to reach 0.01c; a half-built ring only needs 50% speed, so half as long. This is the full-ring time.
tungsten-rain-ring-capacity=How many accelerated rods circulate simultaneously in each planet's ring.
tungsten-rain-ring-stations=How many deflector stations a ring needs to hold a full-speed (0.01c) rod. The rod accelerates itself on its rocket fuel; the stations only contain it, and the faster the rod the more deflectors it takes — so the station count caps the speed, and thus the damage, of the rods a ring can keep. Held speed grows linearly with stations, damage quadratically (energy ∝ v²), radius by cube root. A half-built ring holds only 50%-speed rods (25% damage) but settles them faster.
tungsten-rain-require-rods=If disabled, strikes are free and no ring is needed. For testing, or for those who have made peace with their conscience.
tungsten-rain-friendly-fire=The rod does not discriminate. Disabled by default, because misclicks happen.
tungsten-rain-auto-fire=Let the rings fire on their own: every interval, each ring rains rods on the nearest enemy nests within radar range, clustered by blast radius (no wasted rods), nearest threats first, capped by charged rods. The orbital answer to nests breeding faster than you can click. Off by default; some UPS cost while it scans.
tungsten-rain-auto-interval=How often the auto-fire sweep runs. Keep it above the time-to-impact so a nest isn't fired on twice before the first rod lands.
tungsten-rain-auto-range=How far around each radar auto-fire looks for nests. Default 448 = vanilla radar's far-scan coverage (14 chunks). Raise for modded long-range radars.
tungsten-rain-auto-worms=If enabled, auto-fire also targets enemy worms (turrets), not just spawners. Worms near a nest already die in its blast, so this mainly spends rods on isolated worms.

