ring-disabled=The ring above this planet is not activated. Alt-select with the targeter to enable assembly.
ring-enabled=Ring assembly above __1__ enabled. Stations: __2__/__3__, accelerated rods: __4__. The ring will pull stations and slugs from your platform hubs at this orbit.
ring-paused=Ring above __1__ paused: no stations or rods will be pulled from hubs. Stations: __2__/__3__, accelerated rods: __4__ — the charge is kept and remains fireable. Alt-select to resume.
ring-not-built=No storage ring above this planet. Deliver deflector stations (up to __1__ for full power) to the hub of an orbiting platform — the ring assembles itself.
ring-station-installed=Deflector station deployed: __1__/__2__. The ring operates at reduced velocity.
ring-complete=Storage ring complete: __1__/__2__ stations. Full power. The sky is yours.
no-rods=No accelerated rods in the ring and nothing to spin up. Load tungsten rods into the hub of a platform orbiting this planet — the ring will pick them up automatically.
ring-charging=A rod is still spinning up to cruising velocity: __1__ s remaining.
no-planet=No planet here — and therefore no storage ring above it.
cooldown=Mass driver extraction window not ready: __1__ s remaining.
incoming=Rod released from the ring (power __2__%). Impact imminent. Accelerated rods remaining: __1__.
carpet=Carpet bombardment: __1__ rods on the nest clusters in the box (power __3__%). Accelerated rods remaining: __2__.
carpet-short=Carpet bombardment: __1__ rods away — __2__ nest clusters still standing, ring out of charged rods.
auto=Orbital patrol: __1__ rods on nests within radar range over __2__.
impact=Kinetic impact confirmed at [gps=__1__,__2__,__3__]
no-platform-strikes=Firing the mass driver at your own platform deck is not covered by the warranty.
