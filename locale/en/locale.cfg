tungsten-rain=Kinetic bombardment

[technology-description]
tungsten-rain=The projectile is not accelerated by the shot — the projectile lives accelerated. The storage ring is a necklace of deflector stations in low orbit: rods fly straight chords between them, each station bending the path by its share of the circle through currents induced in the copper Faraday spiral. Slugs delivered by rocket to a platform hub are spun up to a cruising 0.01c and circulate indefinitely — bending does no work, storage is free. A shot is a skipped turn: one station stays dark, and the rod leaves on its chord, downward. Friction against the residual atmosphere heats the circulating slugs to 1700 K, and at night the ring is visible from the surface — a string of dim embers across the sky. Those are not stars. That is the queue. At the point of impact: a fireball and a shockwave, like a nuclear blast but without the radiation — the explosive is velocity. Program goal: to write the fear of the lone engineer into biter DNA, so their great-grandchildren retell legends of the being that must not be touched.

